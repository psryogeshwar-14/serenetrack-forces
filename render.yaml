services:
  - type: web
    name: serenetrack
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      name: serenetrack-data
      mountPath: /app/server/data
      sizeGB: 1
